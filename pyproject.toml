[project]
name = "mcp-official-sdk-lab"
version = "1.0.0"
description = "Independent MCP official Python SDK client/server lab"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.2.0",
]

[project.scripts]
mcp-lab-client = "client.main:main"
mcp-lab-server = "server.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["client", "server"]
